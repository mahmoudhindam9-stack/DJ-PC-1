name: Windows Desktop Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build frontend
        run: npm run build

      - name: Build Windows installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: Verify Windows bundles exist
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          if (-not $nsis) { throw "NSIS installer was not generated." }
          if (-not $msi) { throw "MSI installer was not generated." }
          Write-Host "NSIS: $($nsis.FullName)"
          Write-Host "MSI: $($msi.FullName)"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Desktop-Windows-3.6.8
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
