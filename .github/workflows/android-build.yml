name: Android Build Verification

on:
  push:
    branches: [ main, master ]
    paths:
      - 'legacy/android/app/**'
      - 'legacy/android/build.gradle.kts'
      - 'legacy/android/settings.gradle.kts'
      - 'legacy/android/gradle.properties'
      - 'legacy/android/gradle/**'
      - 'legacy/android/gradlew'
      - 'legacy/android/gradlew.bat'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'legacy/android/**'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Android Project
        id: locate_android
        shell: bash
        run: |
          if [ -d "legacy/android/app" ] && [ -f "legacy/android/gradlew" ]; then
            echo "dir=legacy/android" >> "$GITHUB_OUTPUT"
          elif [ -d "android/app" ] && [ -f "android/gradlew" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          elif [ -d "app" ] && [ -f "gradlew" ] && [ -f "app/build.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "No valid Android project found." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          ANDROID_DIR="${{ steps.locate_android.outputs.dir }}"
          test -f "$ANDROID_DIR/gradlew"
          chmod +x "$ANDROID_DIR/gradlew"

      - name: Assemble debug APK
        shell: bash
        run: |
          ANDROID_DIR="${{ steps.locate_android.outputs.dir }}"
          "$ANDROID_DIR/gradlew" :app:assembleDebug --stacktrace --warning-mode none
