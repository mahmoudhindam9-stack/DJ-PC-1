[package]
name = "dj-desktop"
version = "3.6.8"
description = "DJ Desktop - Advanced DJ Mixer, Music Player, Equalizer & Karaoke Studio"
authors = ["DJ Desktop Team"]
edition = "2021"

[lib]
name = "dj_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
